// --- הגדרות GITHUB ---
const GH_TOKEN = 'כאן_תדביק_את_התוקן_החדש_שייצרת'; 
const GH_USER = 'שם_המשתמש_שלך';
const GH_REPO = 'שם_הריפוזיטורי';
const GH_PATH = 'log.json';<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ריסוס - גרסה סופית</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f4f0; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 550px; margin: auto; margin-bottom: 20px; border-top: 6px solid #2e7d32; }
        h3 { color: #1b5e20; border-bottom: 2px solid #e8f5e9; padding-bottom: 5px; margin-top: 0; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 5px; }
        .chem-item { background: #f9f9f9; padding: 10px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid #2e7d32; position: relative; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .btn-calc { background: #2e7d32; color: white; }
        .btn-add { background: #e8f5e9; color: #2e7d32; border: 1px dashed #2e7d32; }
        #syncStatus { font-size: 11px; text-align: center; color: #666; margin-bottom: 10px; font-weight: bold; }
        
        /* עיצוב הטבלה */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; min-width: 450px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #2e7d32; color: white; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .delete-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

<div id="syncStatus">מתחבר לענן...</div>

<div class="card">
    <h3>1. פרטי ריסוס</h3>
    <label>תאריך:</label>
    <input type="date" id="date">
    <label>גידול:</label>
    <input type="text" id="crop" placeholder="שם הגידול">
    <label>שם חלקה:</label>
    <input type="text" id="plot" placeholder="שם החלקה">
</div>

<div class="card">
    <h3>2. הגדרות ומינונים</h3>
    <label>גודל מרסס (ליטר):</label>
    <input type="number" id="tankSize">
    <label>נפח תרסיס לדונם (ליטר):</label>
    <input type="number" id="waterPerDunam">
    
    <div id="chemicalsContainer"></div>
    <button class="btn btn-add" onclick="addChemical()">+ הוסף חומר</button>
</div>

<div class="card">
    <h3>3. ביצוע ויומן</h3>
    <button class="btn btn-calc" onclick="processAll()">חשב ושמור בענן</button>
    <div id="results" style="display:none; background:#fffde7; padding:15px; border-radius:10px; margin-top:15px; border: 1px solid #fbc02d;"></div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>חלקה</th>
                    <th>חומרים</th>
                    <th>מחיקה</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>
    
    <button class="btn" style="background:#0277bd; color:white; margin-top:20px;" onclick="exportToExcel()">יצוא מלא לאקסל</button>
</div>

<script>
    // --- הגדרות GITHUB - חובה למלא ---
    const GH_TOKEN = 'כאן_התוקן_שלך'; 
    const GH_USER = 'שם_המשתמש_שלך';
    const GH_REPO = 'שם_הריפוזיטורי';
    const GH_PATH = 'log.json';

    let sprayLog = [];
    document.getElementById('date').valueAsDate = new Date();

    // טעינה ראשונית
    async function loadFromGithub() {
        const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_PATH}`;
        try {
            const res = await fetch(url, { headers: { 'Authorization': `token ${GH_TOKEN}` } });
            if (res.ok) {
                const data = await res.json();
                const content = decodeURIComponent(atob(data.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                sprayLog = JSON.parse(content);
                updateLogTable();
                document.getElementById('syncStatus').innerText = "✅ מסונכרן";
            }
        } catch (e) { document.getElementById('syncStatus').innerText = "❌ שגיאת חיבור"; }
    }

    // שמירה לענן
    async function saveToGithub() {
        document.getElementById('syncStatus').innerText = "⏳ שומר לענן...";
        const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_PATH}`;
        let sha = "";
        try {
            const res = await fetch(url, { headers: { 'Authorization': `token ${GH_TOKEN}` } });
            if (res.ok) { sha = (await res.json()).sha; }
        } catch (e) {}

        const str = JSON.stringify(sprayLog, null, 2);
        const content = btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        
        await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Update log", content: content, sha: sha })
        });
        document.getElementById('syncStatus').innerText = "✅ נשמר בהצלחה";
    }

    function addChemical() {
        const div = document.createElement('div');
        div.className = 'chem-item';
        div.innerHTML = `
            <button style="float:left; color:red; border:none; background:none; cursor:pointer;" onclick="this.parentElement.remove()">X</button>
            <input type="text" class="chem-name" placeholder="שם חומר">
            <select class="calc-type">
                <option value="percent">אחוז (%)</option>
                <option value="gramLiter">גרם/סמ"ק לליטר</option>
            </select>
            <input type="number" step="0.001" class="chem-value" placeholder="מינון">
        `;
        document.getElementById('chemicalsContainer').appendChild(div);
    }

    function processAll() {
        const tank = parseFloat(document.getElementById('tankSize').value);
        if(!tank) return alert("מלא נפח מרסס");

        const names = document.getElementsByClassName('chem-name');
        const types = document.getElementsByClassName('calc-type');
        const values = document.getElementsByClassName('chem-value');
        
        let materialsArr = [];
        let resultsText = "<strong>תוצאות:</strong><br>";

        for(let i=0; i<names.length; i++) {
            let val = parseFloat(values[i].value);
            if(val) {
                let amount = (types[i].value === 'percent') ? (val/100)*tank*1000 : val*tank;
                let text = `${names[i].value || 'חומר'}: ${amount.toFixed(1)} סמ"ק/גרם`;
                materialsArr.push(text);
                resultsText += text + "<br>";
            }
        }

        const entry = {
            id: Date.now(), // מזהה ייחודי למחיקה
            date: document.getElementById('date').value,
            info: `${document.getElementById('crop').value} - ${document.getElementById('plot').value}`,
            materials: materialsArr.join(' | '),
            tank: tank
        };

        sprayLog.unshift(entry);
        document.getElementById('results').innerHTML = resultsText;
        document.getElementById('results').style.display = 'block';
        updateLogTable();
        saveToGithub();
    }

    // פונקציית המחיקה החדשה
    function deleteRow(id) {
        if(confirm("האם למחוק את השורה מהיומן ומהענן?")) {
            sprayLog = sprayLog.filter(item => item.id !== id);
            updateLogTable();
            saveToGithub();
        }
    }

    function updateLogTable() {
        const body = document.getElementById('logBody');
        body.innerHTML = "";
        sprayLog.forEach(e => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${e.date}</td>
                <td>${e.info}</td>
                <td>${e.materials}</td>
                <td><button class="delete-btn" onclick="deleteRow(${e.id})">מחק</button></td>
            `;
            body.appendChild(row);
        });
    }

    function exportToExcel() {
        const data = sprayLog.map(e => ({
            "תאריך": e.date,
            "חלקה": e.info,
            "גודל מרסס": e.tank,
            "חומרים וכמויות": e.materials
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "יומן");
        XLSX.writeFile(wb, "SprayLog_Full.xlsx");
    }

    window.onload = () => { addChemical(); loadFromGithub(); };
</script>

</body>
</html>
