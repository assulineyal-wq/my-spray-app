<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ריסוס - הוספת תכשירים</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f4f7f4; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border-top: 8px solid #2e7d32; }
        h2 { color: #1b5e20; text-align: center; margin-top: 0; }
        
        .section { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        .section-title { font-weight: bold; color: #2e7d32; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #444; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        
        .chemical-item { background: #fff; padding: 12px; border-radius: 10px; border-right: 5px solid #4caf50; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .remove-btn { position: absolute; left: 10px; top: 10px; color: red; font-weight: bold; cursor: pointer; border: none; background: none; }
        
        .btn-add { background-color: #e8f5e9; color: #2e7d32; border: 2px dashed #2e7d32; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; margin-bottom: 15px; font-weight: bold; font-size: 16px; }
        .btn-calc { background-color: #2e7d32; color: white; border: none; padding: 18px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 20px; font-weight: bold; transition: 0.3s; }
        .btn-calc:active { transform: scale(0.98); background-color: #1b5e20; }
        
        #results { margin-top: 25px; display: none; padding: 20px; background: #fff; border-radius: 15px; border: 2px solid #2e7d32; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .res-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
        .total-coverage { text-align: center; font-size: 19px; color: #1b5e20; margin-bottom: 15px; padding: 10px; background: #e8f5e9; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>מחשבון תערובת תכשירים</h2>
    
    <div class="section">
        <div class="section-title">פרטי הריסוס</div>
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>תאריך:</label>
                <input type="date" id="sprayDate">
            </div>
            <div style="flex: 1;">
                <label>חלקה:</label>
                <input type="text" id="plotName" placeholder="שם החלקה">
            </div>
        </div>
        <label>סוג הגידול:</label>
        <input type="text" id="cropName" placeholder="למשל: פרדס, כרם, פלפל">
    </div>

    <div class="section">
        <div class="section-title">נתוני מרסס</div>
        <label>נפח המיכל (ליטר):</label>
        <input type="number" id="tankSize" placeholder="למשל: 1000">
        <label>מים לדונם (ליטר):</label>
        <input type="number" id="waterPerDunam" placeholder="למשל: 35">
    </div>

    <div class="section">
        <div class="section-title">רשימת תכשירים</div>
        <div id="chemicalsList">
            </div>
        <button class="btn-add" onclick="addChem()">+ הוסף תכשיר (חומר הדברה)</button>
    </div>

    <button class="btn-calc" onclick="calculate()">חשב כמויות למיכל</button>

    <div id="results">
        <div id="coverage" class="total-coverage"></div>
        <div id="finalAmounts"></div>
        <div style="text-align: center; margin-top: 15px;">
            <button onclick="window.print()" style="background: none; border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; cursor: pointer;">הדפס / שמור כ-PDF</button>
        </div>
    </div>
</div>

<script>
    // הגדרת תאריך להיום והוספת שדה ראשון אוטומטית
    document.getElementById('sprayDate').valueAsDate = new Date();
    
    // מוסיף שדה ראשון מיד עם טעינת הדף
    window.onload = addChem;

    function addChem() {
        const container = document.getElementById('chemicalsList');
        const div = document.createElement('div');
        div.className = 'chemical-item';
        div.innerHTML = `
            <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            <label>שם התכשיר:</label>
            <input type="text" class="chem-name" placeholder="למשל: קוצייד">
            <label>מינון (סמ"ק/גרם לדונם):</label>
            <input type="number" class="chem-dose" placeholder="כמות לדונם">
        `;
        container.appendChild(div);
    }

    function calculate() {
        const tank = parseFloat(document.getElementById('tankSize').value);
        const water = parseFloat(document.getElementById('waterPerDunam').value);
        
        if (!tank || !water) {
            alert("חובה למלא נפח מיכל וכמות מים לדונם");
            return;
        }

        const coverage = tank / water;
        document.getElementById('coverage').innerHTML = `המיכל מכסה: ${coverage.toFixed(2)} דונם`;

        const names = document.getElementsByClassName('chem-name');
        const doses = document.getElementsByClassName('chem-dose');
        let html = "";
        let count = 0;

        for (let i = 0; i < doses.length; i++) {
            const dose = parseFloat(doses[i].value);
            if (dose) {
                const name = names[i].value || `תכשיר ${i+1}`;
                const totalAmount = dose * coverage;
                html += `<div class="res-row"><span>${name}:</span> <strong>${totalAmount.toFixed(1)} סמ"ק/גרם</strong></div>`;
                count++;
            }
        }

        if (count === 0) {
            alert("נא להזין לפחות תכשיר אחד עם מינון");
            return;
        }

        document.getElementById('finalAmounts').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        
        // גלילה חלקה לתוצאות
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
