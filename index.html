<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ריסוס מקצועי - מאגר מלא</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #2e7d32; --secondary: #1565c0; --bg: #f0f4f8; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 700px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; text-align: right; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .mix-section { background: #f9f9f9; padding: 15px; border-radius: 12px; border-right: 5px solid var(--primary); margin-top: 15px; }
        .mix-section.blue { border-right-color: var(--secondary); background: #f0f7ff; }
        .res-display { background: #fffde7; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; text-align: center; border: 1px solid #ffe082; }
        button { width: 100%; background: var(--primary); color: white; padding: 15px; border: none; border-radius: 10px; font-size: 18px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        .manual-hint { font-size: 11px; color: #666; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #eee; }
        .delete-btn { color: red; cursor: pointer; border: none; background: none; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="text-align:center;">מחשבון ריסוס מבוסס שה"מ</h2>
        
        <div class="grid">
            <div>
                <label>תאריך:</label>
                <input type="date" id="sprayDate">
            </div>
            <div>
                <label>מים במיכל (ליטר):</label>
                <input type="number" id="tankLiters" value="15" oninput="calculateAll()">
            </div>
            <div>
                <label>בחר סוג גידול:</label>
                <select id="cropType" onchange="updateLists()">
                    <option value="">-- בחר גידול --</option>
                    <option value="גפן">גפן (כרם)</option>
                    <option value="חציל">חציל</option>
                </select>
            </div>
            <div>
                <label>שם חלקה:</label>
                <input type="text" id="fieldName" placeholder="הזן שם חלקה">
            </div>
        </div>

        <div class="mix-section">
            <label>חומר 1 (בחר מהרשימה או הקלד חופשי):</label>
            <input type="text" id="chem1" list="list1" oninput="autoDose(1)" placeholder="הקלד שם חומר...">
            <datalist id="list1"></datalist>
            
            <label style="margin-top:10px;">מינון (%): <small>(מתמלא אוטומטית, ניתן לשינוי)</small></label>
            <input type="number" id="dose1" step="0.001" oninput="calculateAll()" placeholder="למשל: 0.1">
            
            <div id="res1" class="res-display">כמות להוספה: -</div>
        </div>

        <div class="mix-section blue">
            <label>חומר 2 (אופציונלי):</label>
            <input type="text" id="chem2" list="list2" oninput="autoDose(2)" placeholder="הקלד שם חומר...">
            <datalist id="list2"></datalist>
            
            <label style="margin-top:10px;">מינון (%):</label>
            <input type="number" id="dose2" step="0.001" oninput="calculateAll()" placeholder="למשל: 0.05">
            
            <div id="res2" class="res-display">כמות להוספה: -</div>
        </div>

        <button onclick="saveToLog()">שמור ריסוס ביומן</button>
    </div>

    <div class="card" style="overflow-x: auto;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>יומן ריסוסים שנשמר</h3>
            <button onclick="exportToExcel()" style="width:auto; padding:5px 15px; background:#555;">Excel</button>
        </div>
        <table id="logTable">
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>חלקה</th>
                    <th>גידול</th>
                    <th>פירוט</th>
                    <th>מחיקה</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // מאגר נתונים מלא מהקבצים שלך
    const database = {
        "גפן": [
            { name: "אפלורד", dose: 0.15 }, { name: "מובנטו 100", dose: 0.09 }, { name: "סורנטו", dose: 0.04 },
            { name: "קונפידור", dose: 0.05 }, { name: "סייפן", dose: 0.05 }, { name: "קודקוד", dose: 0.05 },
            { name: "קוהינור", dose: 0.05 }, { name: "קלאץ", dose: 0.05 }, { name: "טרייסר אולטרה", dose: 0.06 },
            { name: "ויוואנדו", dose: 0.03 }, { name: "קאסורי", dose: 0.03 }, { name: "דיסקברי", dose: 0.10 },
            { name: "לונה סנסיישן", dose: 0.06 }, { name: "בליס", dose: 0.10 }, { name: "סיגנום", dose: 0.15 },
            { name: "סטנגה", dose: 0.15 }, { name: "קנג'ה", dose: 0.15 }, { name: "טלדור 500", dose: 0.15 },
            { name: "סוויץ", dose: 0.10 }, { name: "אוהיו", dose: 0.10 }, { name: "קסטודיה", dose: 0.10 },
            { name: "מיתוס", dose: 0.25 }, { name: "סרנייד ASO", dose: 1.0 }, { name: "אינדר", dose: 0.15 }
        ],
        "חציל": [
            { name: "ורטימק", dose: 0.05 }, { name: "אוברון", dose: 0.06 }, { name: "פגסוס", dose: 0.15 },
            { name: "מטאור", dose: 0.10 }, { name: "אמפייר", dose: 0.08 }, { name: "דינמיק", dose: 0.05 },
            { name: "נימגארד", dose: 1.0 }, { name: "גניקן", dose: 1.0 }, { name: "נימפר", dose: 1.0 },
            { name: "כיפת ברזל", dose: 1.0 }, { name: "נץ", dose: 0.02 }, { name: "ביוגארד 100", dose: 0.4 },
            { name: "סרנייד ASO", dose: 0.5 }, { name: "מור", dose: 1.0 }, { name: "רובראל", dose: 0.2 }
        ]
    };

    document.getElementById('sprayDate').valueAsDate = new Date();
    window.onload = function() {
        const saved = JSON.parse(localStorage.getItem('sprayLogs') || '[]');
        saved.forEach(renderRow);
    };

    function updateLists() {
        const crop = document.getElementById('cropType').value;
        const l1 = document.getElementById('list1'), l2 = document.getElementById('list2');
        l1.innerHTML = l2.innerHTML = "";
        if (database[crop]) {
            database[crop].forEach(c => {
                let op = `<option value="${c.name}">`;
                l1.innerHTML += op; l2.innerHTML += op;
            });
        }
    }

    function autoDose(num) {
        const crop = document.getElementById('cropType').value;
        const name = document.getElementById('chem' + num).value;
        const doseInput = document.getElementById('dose' + num);
        
        if (database[crop]) {
            const chem = database[crop].find(c => c.name === name);
            if (chem) doseInput.value = chem.dose;
        }
        calculateAll();
    }

    function calculateAll() {
        const liters = parseFloat(document.getElementById('tankLiters').value) || 0;
        [1, 2].forEach(num => {
            const dose = parseFloat(document.getElementById('dose' + num).value) || 0;
            const resDiv = document.getElementById('res' + num);
            if (dose > 0 && liters > 0) {
                const total = (dose / 100) * liters * 1000;
                resDiv.innerHTML = `כמות להוספה: <span style="color:red; font-size:20px;">${total.toFixed(1)} סמ"ק</span>`;
                resDiv.dataset.cc = total.toFixed(1);
            } else {
                resDiv.innerHTML = "כמות להוספה: -";
                resDiv.dataset.cc = "";
            }
        });
    }

    function saveToLog() {
        const date = document.getElementById('sprayDate').value.split('-').reverse().join('/');
        const field = document.getElementById('fieldName').value || "כללי";
        const crop = document.getElementById('cropType').value || "אחר";
        const details = getDetails();

        if (!details) { alert("מלא לפחות חומר אחד ומינון"); return; }

        const entry = { id: Date.now(), date, field, crop, details };
        const saved = JSON.parse(localStorage.getItem('sprayLogs') || '[]');
        saved.unshift(entry);
        localStorage.setItem('sprayLogs', JSON.stringify(saved));
        renderRow(entry, true);
    }

    function getDetails() {
        let txt = "";
        [1, 2].forEach(num => {
            const name = document.getElementById('chem' + num).value;
            const cc = document.getElementById('res' + num).dataset.cc;
            if (name && cc) txt += (txt ? " + " : "") + `${name}: ${cc}cc`;
        });
        return txt;
    }

    function renderRow(item, isNew = false) {
        const tbody = document.querySelector('#logTable tbody');
        const row = isNew ? tbody.insertRow(0) : tbody.insertRow();
        row.innerHTML = `<td>${item.date}</td><td><b>${item.field}</b></td><td>${item.crop}</td><td>${item.details}</td><td><button class="delete-btn" onclick="deleteItem(${item.id}, this)">❌</button></td>`;
    }

    function deleteItem(id, btn) {
        if(confirm("למחוק?")) {
            let saved = JSON.parse(localStorage.getItem('sprayLogs') || '[]');
            saved = saved.filter(i => i.id !== id);
            localStorage.setItem('sprayLogs', JSON.stringify(saved));
            btn.closest('tr').remove();
        }
    }

    function exportToExcel() {
        const wb = XLSX.utils.table_to_book(document.getElementById("logTable"));
        XLSX.writeFile(wb, "Spray_History.xlsx");
    }
</script>

</body>
</html>
