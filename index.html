<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ריסוס רב-חומרי</title>
    <style>
        body { font-family: sans-serif; background-color: #eef2f3; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h2 { color: #1b5e20; text-align: center; margin-top: 0; }
        .input-group { background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-right: 5px solid #2e7d32; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        .chemical-row { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .btn-add { background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .btn-calc { background-color: #2e7d32; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 18px; font-weight: bold; }
        #results { margin-top: 20px; display: none; }
        .result-item { background: #e8f5e9; padding: 10px; border-radius: 8px; margin-bottom: 5px; border-right: 4px solid #1b5e20; }
    </style>
</head>
<body>

<div class="card">
    <h2>מחשבון תערובת ריסוס</h2>
    
    <div class="input-group">
        <label>נפח המיכל (ליטרים):</label>
        <input type="number" id="tankSize" placeholder="למשל: 15">
        
        <label>כמות מים לדונם (ליטרים):</label>
        <input type="number" id="waterPerDunam" placeholder="למשל: 30">
    </div>

    <div id="chemicalsContainer">
        <div class="chemical-row">
            <label>שם חומר 1 / מינון (סמ"ק לדונם):</label>
            <input type="text" class="chem-name" placeholder="שם החומר (אופציונלי)">
            <input type="number" class="chem-dose" placeholder="כמות סמ"ק לדונם">
        </div>
    </div>

    <button class="btn-add" onclick="addChemical()">+ הוסף חומר נוסף לתערובת</button>
    <button class="btn-calc" onclick="calculateAll()">חשב כמויות למיכל</button>

    <div id="results">
        <h3 style="text-align: center;">תוצאות להכנה:</h3>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    let chemCount = 1;

    function addChemical() {
        chemCount++;
        const container = document.getElementById('chemicalsContainer');
        const div = document.createElement('div');
        div.className = 'chemical-row';
        div.innerHTML = `
            <label>שם חומר ${chemCount} / מינון (סמ"ק לדונם):</label>
            <input type="text" class="chem-name" placeholder="שם החומר">
            <input type="number" class="chem-dose" placeholder="כמות סמ"ק לדונם">
        `;
        container.appendChild(div);
    }

    function calculateAll() {
        const tank = parseFloat(document.getElementById('tankSize').value);
        const water = parseFloat(document.getElementById('waterPerDunam').value);
        const names = document.getElementsByClassName('chem-name');
        const doses = document.getElementsByClassName('chem-dose');
        const resultsList = document.getElementById('resultsList');
        const resultsDiv = document.getElementById('results');

        if (!tank || !water) {
            alert("נא למלא נפח מיכל וכמות מים לדונם");
            return;
        }

        resultsList.innerHTML = "";
        let hasData = false;

        for (let i = 0; i < doses.length; i++) {
            const dose = parseFloat(doses[i].value);
            if (dose) {
                const name = names[i].value || `חומר ${i + 1}`;
                const finalAmount = (dose * tank) / water;
                
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `<strong>${name}:</strong> ${finalAmount.toFixed(1)} סמ"ק`;
                resultsList.appendChild(item);
                hasData = true;
            }
        }

        if (hasData) {
            resultsDiv.style.display = 'block';
        } else {
            alert("נא להזין מינון לפחות לחומר אחד");
        }
    }
</script>

</body>
</html>
