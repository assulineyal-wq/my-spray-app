<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ריסוס לפי אחוזים</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f0f7ff; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border-top: 8px solid #007bff; }
        h2 { color: #0056b3; text-align: center; margin-top: 0; }
        .section { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #444; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        .chemical-item { background: #fff; padding: 12px; border-radius: 10px; border-right: 5px solid #007bff; margin-bottom: 10px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .remove-btn { position: absolute; left: 10px; top: 10px; color: red; font-weight: bold; cursor: pointer; border: none; background: none; }
        .btn-add { background-color: #f0f7ff; color: #0056b3; border: 2px dashed #007bff; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .btn-calc { background-color: #007bff; color: white; border: none; padding: 18px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 20px; font-weight: bold; }
        #results { margin-top: 25px; display: none; padding: 20px; background: #e7f3ff; border-radius: 15px; border: 2px solid #007bff; }
        .res-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #cce5ff; font-size: 18px; }
    </style>
</head>
<body>

<div class="card">
    <h2>מחשבון ריסוס (לפי אחוז)</h2>
    
    <div class="section">
        <label>שם החלקה / גידול:</label>
        <input type="text" id="plotInfo" placeholder="למשל: פרדס - חלקה 3">
        <label>נפח המיכל (ליטר):</label>
        <input type="number" id="tankSize" placeholder="למשל: 15 או 500">
    </div>

    <div class="section">
        <div style="font-weight:bold; color:#0056b3; margin-bottom:10px;">רשימת תכשירים:</div>
        <div id="chemicalsList"></div>
        <button class="btn-add" onclick="addChem()">+ הוסף תכשיר</button>
    </div>

    <button class="btn-calc" onclick="calculate()">חשב כמויות למיכל</button>

    <div id="results">
        <div id="summaryTitle" style="font-weight:bold; margin-bottom:10px;"></div>
        <div id="finalAmounts"></div>
        <p style="font-size: 12px; text-align: center; margin-top: 15px;">החישוב מתבצע לפי ריכוז מנפח המים.</p>
    </div>
</div>

<script>
    window.onload = addChem;

    function addChem() {
        const container = document.getElementById('chemicalsList');
        const div = document.createElement('div');
        div.className = 'chemical-item';
        div.innerHTML = `
            <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            <label>שם התכשיר:</label>
            <input type="text" class="chem-name" placeholder="למשל: שמן קיצי">
            <label>ריכוז נדרש (ב-%):</label>
            <input type="number" class="chem-percent" step="0.01" placeholder="למשל: 1.5">
        `;
        container.appendChild(div);
    }

    function calculate() {
        const tank = parseFloat(document.getElementById('tankSize').value);
        if (!tank) { alert("נא להזין נפח מיכל"); return; }

        const names = document.getElementsByClassName('chem-name');
        const percents = document.getElementsByClassName('chem-percent');
        let html = "";
        let count = 0;

        for (let i = 0; i < percents.length; i++) {
            const pct = parseFloat(percents[i].value);
            if (pct) {
                const name = names[i].value || `תכשיר ${i+1}`;
                // חישוב: (אחוז / 100) * ליטרים במיכל * 1000 כדי לקבל סמ"ק
                const amountCc = (pct / 100) * tank * 1000;
                
                html += `<div class="res-row">
                            <span>${name} (${pct}%):</span> 
                            <strong>${amountCc.toLocaleString()} סמ"ק</strong>
                         </div>`;
                count++;
            }
        }

        if (count === 0) { alert("נא להזין לפחות תכשיר אחד"); return; }

        document.getElementById('summaryTitle').innerText = "עבור מיכל של " + tank + " ליטר:";
        document.getElementById('finalAmounts').innerHTML = html;
        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
