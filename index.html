<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ריסוס חכם</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f0f2f5; padding: 20px; color: #1c1e21; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h2 { color: #2e7d32; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #4b4b4b; }
        input { width: 100%; padding: 12px; border: 2px solid #e4e6eb; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: border-color 0.3s; }
        input:focus { border-color: #2e7d32; outline: none; }
        button { width: 100%; background-color: #2e7d32; color: white; padding: 15px; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; font-size: 18px; font-weight: bold; }
        button:active { transform: scale(0.98); }
        #result { margin-top: 25px; padding: 20px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 12px; text-align: center; display: none; }
        .unit { font-size: 0.9em; color: #65676b; margin-right: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>מחשבון מינון בשטח</h2>
    
    <div class="input-group">
        <label>נפח המיכל שלך <span class="unit">(ליטרים)</span>:</label>
        <input type="number" id="tankSize" placeholder="כמה ליטר המרסס מכיל?">
    </div>

    <div class="input-group">
        <label>מינון מבוקש <span class="unit">(סמ"ק/גרם לדונם)</span>:</label>
        <input type="number" id="dosage" placeholder="לפי תווית החומר">
    </div>

    <div class="input-group">
        <label>כיול: מים לדונם <span class="unit">(ליטרים)</span>:</label>
        <input type="number" id="waterPerDunam" placeholder="כמה ליטר יוצאים לדונם?">
    </div>

    <button onclick="calculate()">חשב כמות חומר</button>

    <div id="result"></div>
</div>

<script>
    // טעינת נתונים שמורים כשפותחים את האפליקציה
    window.onload = function() {
        if(localStorage.getItem('tankSize')) {
            document.getElementById('tankSize').value = localStorage.getItem('tankSize');
        }
        if(localStorage.getItem('waterPerDunam')) {
            document.getElementById('waterPerDunam').value = localStorage.getItem('waterPerDunam');
        }
    };

    function calculate() {
        const tank = document.getElementById('tankSize').value;
        const dose = document.getElementById('dosage').value;
        const water = document.getElementById('waterPerDunam').value;
        const resultDiv = document.getElementById('result');

        if(tank && dose && water) {
            // שמירת הנתונים הקבועים בזיכרון הטלפון/מחשב
            localStorage.setItem('tankSize', tank);
            localStorage.setItem('waterPerDunam', water);

            const finalAmount = (dose * tank) / water;
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div style="font-size: 16px; margin-bottom: 5px;">יש להוסיף למיכל:</div>
                <div style="font-size: 32px; color: #1b5e20; font-weight: 800;">${finalAmount.toFixed(1)}</div>
                <div style="font-size: 18px; color: #1b5e20;">סמ"ק / גרם חומר</div>
            `;
        } else {
            alert("נא למלא את כל השדות כדי לקבל תוצאה");
        }
    }
</script>

</body>
</html>
